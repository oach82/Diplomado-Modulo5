[pytest]
# Donde viven los tests (step definitions de pytest-bdd)
testpaths = tests
# Donde pytest-bdd busca los .feature (Gherkin)
bdd_features_base_dir = features
# Marcadores usados en los escenarios
markers =
    catalogo: casos de la suite Catalogo (Test Plans Dia 3)
    carrito: casos de la suite Carrito
    pedidos: casos de la suite Pedidos
    smoke: subconjunto critico para humo
# Salida mas legible
addopts = -v --tb=short
