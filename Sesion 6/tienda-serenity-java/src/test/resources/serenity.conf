# ============================================================
#  Configuracion Serenity — self-healing con Healenium via hlm-proxy
#
#  Enfoque OFICIAL de Healenium para Serenity (healenium.io/frameworks):
#  Serenity usa un WebDriver REMOTO normal que apunta al hlm-proxy. El proxy
#  se interpone entre Serenity y el Selenium Grid: cuando un localizador falla,
#  el proxy consulta al backend de Healenium, encuentra el elemento mas parecido
#  (self-healing) y continua. Serenity no sabe que hay un sanador debajo.
#
#  Clave: Serenity resuelve los Targets con findElements (plural). Por eso el
#  backend de Healenium DEBE arrancar con FIND_ELEMENTS_AUTO_HEALING=true
#  (si no, el healing de busquedas plurales queda desactivado por defecto).
#
#  La URL del proxy se inyecta por la variable de entorno HLM_PROXY_URL
#  (en contenedores: http://hlm-proxy:8085). Para correr SIN healing (comparar),
#  apunta remote.url directo al grid: http://selenium-hub:4444/wd/hub
# ============================================================

webdriver {
  driver = remote
  # remote.url lo fija build.gradle via -Dwebdriver.remote.url (apunta al
  # hlm-proxy para self-healing, o al grid directo para comparar sin healing).
  remote.driver = chrome
  capabilities {
    browserName = "chrome"
    "goog:chromeOptions" {
      args = ["--headless=new", "--no-sandbox", "--disable-dev-shm-usage", "--disable-gpu", "--window-size=1400,1000"]
    }
  }
}

# URL base de la app Tienda (SUT). La inyecta build.gradle (-DbaseUrl) o el env.
environments {
  default {
    webdriver.base.url = "http://localhost:3000"
  }
  docker {
    # Dentro de la red de Podman, la app se llama 'app-tienda'
    webdriver.base.url = "http://app-tienda:3000"
  }
}

serenity {
  take.screenshots = FOR_FAILURES
  tag.failures = true
  report.show.step.details = true
}
